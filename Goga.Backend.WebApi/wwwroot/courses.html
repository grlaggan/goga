<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goga — курсы</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; font: 16px system-ui, sans-serif; color: #1d2433; background: #f4f5f7; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 18px max(24px, calc((100% - 1000px) / 2)); background: #fff; border-bottom: 1px solid #e2e5ea; }
    .brand, a { color: #315bea; text-decoration: none; font-weight: 600; } .brand { color: #1d2433; font-size: 20px; } nav { display: flex; gap: 18px; align-items: center; }
    main { width: min(100% - 32px, 1000px); margin: 42px auto; } h1 { margin: 0 0 8px; font-size: 30px; } .subtitle { margin: 0 0 28px; color: #657084; }
    .courses { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; } .card { padding: 22px; background: #fff; border: 1px solid #e2e5ea; border-radius: 12px; box-shadow: 0 8px 24px #1720330d; }
    h2 { margin: 0 0 14px; font-size: 20px; } ul { padding-left: 20px; color: #657084; } li { margin: 8px 0; } button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #315bea; color: white; font: inherit; font-weight: 600; cursor: pointer; } button:disabled { opacity: .65; }
    .status { margin-bottom: 20px; padding: 14px; border-radius: 8px; background: #fff; } .error { color: #c62828; } .success { color: #24733d; } .hidden { display: none; }
  </style>
</head>
<body>
  <header><a class="brand" href="/">Goga</a><nav><a href="/">Главная</a><a id="authLink" href="/auth.html">Войти</a><a id="logout" class="hidden" href="#">Выйти</a></nav></header>
  <main>
    <h1>Курсы</h1>
    <p class="subtitle">Выберите курс и получите доступ к лекциям.</p>
    <div id="status" class="status">Загрузка курсов...</div>
    <section id="courses" class="courses"></section>
  </main>
  <script>
    const tokenKey = 'accessToken', token = localStorage.getItem(tokenKey), status = document.querySelector('#status');
    const list = document.querySelector('#courses'), authLink = document.querySelector('#authLink'), logout = document.querySelector('#logout');
    if (!token) { status.className = 'status error'; status.textContent = 'Для просмотра курсов необходимо войти.'; }
    else {
      authLink.classList.add('hidden'); logout.classList.remove('hidden');
      fetch('/api/courses', { headers: { Authorization: `Bearer ${token}` } }).then(async response => {
        if (response.status === 401) throw new Error('Сессия истекла. Войдите снова.');
        if (!response.ok) throw new Error('Не удалось загрузить курсы.');
        return response.json();
      }).then(courses => { status.classList.add('hidden'); courses.forEach(renderCourse); }).catch(error => { status.className = 'status error'; status.textContent = error.message; });
    }
    function renderCourse(course) {
      const card = document.createElement('article'); card.className = 'card';
      const lectures = course.sections.map(section => `<li>${section.name} — <a href="${section.pdfPath}" target="_blank" rel="noopener">PDF</a></li>`).join('');
      card.innerHTML = `<h2>${course.name}</h2><ul>${lectures}</ul><button>Записаться</button>`;
      card.querySelector('button').addEventListener('click', async event => {
        event.target.disabled = true;
        const response = await fetch(`/api/courses/${course.id}/enroll`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
        const data = await response.json(); status.className = response.ok ? 'status success' : 'status error'; status.textContent = data.message || 'Операция завершена.'; event.target.textContent = response.ok ? 'Вы записаны' : 'Записаться'; event.target.disabled = response.ok;
      });
      list.appendChild(card);
    }
    logout.addEventListener('click', event => { event.preventDefault(); localStorage.removeItem(tokenKey); location.href = '/auth.html'; });
  </script>
</body>
</html>
