<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goga — авторизация</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; font: 16px system-ui, sans-serif; color: #1d2433; background: #f4f5f7; }
    main { width: min(100%, 400px); padding: 32px; background: #fff; border: 1px solid #e2e5ea; border-radius: 14px; box-shadow: 0 12px 35px #17203312; }
    h1 { margin: 0 0 8px; font-size: 24px; } p { margin: 0 0 24px; color: #657084; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; }
    input, button { width: 100%; padding: 11px 12px; border-radius: 8px; font: inherit; }
    input { border: 1px solid #cbd1da; } button { margin-top: 20px; border: 0; background: #315bea; color: #fff; cursor: pointer; font-weight: 600; } button:disabled { opacity: .6; }
    #result { min-height: 20px; margin-top: 20px; white-space: pre-wrap; font-size: 14px; } .error { color: #c62828; } .success { color: #24733d; }
    .hidden { display: none; }
    .switch { margin-top: 20px; text-align: center; font-size: 14px; }
    a { color: #315bea; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Вход</h1>
    <p id="description">Войдите, чтобы получить доступ к защищённой части приложения.</p>
    <form id="loginForm">
      <div id="registrationFields" class="hidden">
        <label for="group">Группа</label>
        <input id="group" name="group" type="text" autocomplete="organization" maxlength="100">
        <label for="firstName">Имя</label>
        <input id="firstName" name="firstName" type="text" autocomplete="given-name" maxlength="100">
        <label for="lastName">Фамилия</label>
        <input id="lastName" name="lastName" type="text" autocomplete="family-name" maxlength="100">
      </div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Пароль (минимум 8 символов)</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
      <button id="submit" type="submit">Войти</button>
    </form>
    <div id="result" role="status"></div>
    <div class="switch"><a id="switchMode" href="#register">Нет аккаунта? Зарегистрироваться</a></div>
    <div class="switch"><a href="/">← Вернуться на главную</a></div>
  </main>
  <script>
    const form = document.querySelector('#loginForm');
    const result = document.querySelector('#result');
    const button = document.querySelector('#submit');
    const title = document.querySelector('#title');
    const description = document.querySelector('#description');
    const registrationFields = document.querySelector('#registrationFields');
    const group = document.querySelector('#group');
    const firstName = document.querySelector('#firstName');
    const lastName = document.querySelector('#lastName');
    const switchMode = document.querySelector('#switchMode');
    let isRegistration = false;

    function setMode(registration) {
      isRegistration = registration;
      title.textContent = registration ? 'Регистрация' : 'Вход';
      description.textContent = registration ? 'Создайте аккаунт для доступа к приложению.' : 'Войдите, чтобы получить доступ к защищённой части приложения.';
      registrationFields.classList.toggle('hidden', !registration);
      group.required = registration;
      firstName.required = registration;
      lastName.required = registration;
      button.textContent = registration ? 'Зарегистрироваться' : 'Войти';
      switchMode.textContent = registration ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
      switchMode.href = registration ? '#login' : '#register';
      result.textContent = '';
    }

    switchMode.addEventListener('click', (event) => { event.preventDefault(); setMode(!isRegistration); });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.className = '';
      result.textContent = 'Проверка...';

      try {
        const response = await fetch(isRegistration ? '/api/auth/register' : '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: form.email.value.trim(),
            password: form.password.value,
            group: form.group.value.trim(),
            firstName: form.firstName.value.trim(),
            lastName: form.lastName.value.trim()
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || (isRegistration ? 'Не удалось зарегистрироваться' : 'Не удалось войти'));

        localStorage.setItem('accessToken', data.accessToken);
        result.className = 'success';
        result.textContent = isRegistration ? 'Регистрация выполнена. Перенаправление...' : 'Вход выполнен. Перенаправление...';
        window.location.href = '/';
      } catch (error) {
        result.className = 'error';
        result.textContent = error.message || 'Ошибка соединения с сервером';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
