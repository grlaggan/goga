<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goga — главная</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font: 16px system-ui, sans-serif; color: #1d2433; background: #f4f5f7; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 18px max(24px, calc((100% - 960px) / 2)); background: #fff; border-bottom: 1px solid #e2e5ea; }
    .brand { color: #1d2433; font-size: 20px; font-weight: 700; text-decoration: none; }
    nav { display: flex; align-items: center; gap: 16px; }
    a { color: #315bea; font-weight: 600; text-decoration: none; }
    button { padding: 9px 14px; border: 0; border-radius: 8px; background: #315bea; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.secondary { background: #eef1f8; color: #315bea; }
    main { width: min(100% - 32px, 760px); margin: 72px auto; padding: 40px; background: #fff; border: 1px solid #e2e5ea; border-radius: 14px; box-shadow: 0 12px 35px #17203312; }
    h1 { margin: 0 0 10px; font-size: 32px; } p { color: #657084; line-height: 1.5; }
    #userState { margin-top: 28px; padding: 18px; border-radius: 10px; background: #f7f8fb; }
    .hidden { display: none; }
    @media (max-width: 520px) { header { padding: 16px; } main { margin: 32px auto; padding: 24px; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Goga</a>
    <nav>
      <a href="/courses.html">Курсы</a>
      <a id="authLink" href="/auth.html">Войти</a>
      <button id="logout" class="secondary hidden" type="button">Выйти</button>
    </nav>
  </header>
  <main>
    <h1>Добро пожаловать</h1>
    <p>Это главная страница приложения. Авторизуйтесь, чтобы получить доступ к защищённым данным.</p>
    <section id="userState">Проверяем статус авторизации...</section>
  </main>
  <script>
    const token = localStorage.getItem('accessToken');
    const authLink = document.querySelector('#authLink');
    const logout = document.querySelector('#logout');
    const userState = document.querySelector('#userState');

    async function loadUser() {
      if (!token) {
        userState.textContent = 'Вы не авторизованы. Нажмите «Войти», чтобы продолжить.';
        return;
      }

      try {
        const response = await fetch('/api/protected', { headers: { Authorization: `Bearer ${token}` } });
        if (!response.ok) throw new Error();
        const data = await response.json();
        authLink.classList.add('hidden');
        logout.classList.remove('hidden');
        userState.textContent = data.message || 'Вы авторизованы.';
      } catch {
        localStorage.removeItem('accessToken');
        userState.textContent = 'Сессия истекла. Войдите снова.';
      }
    }

    logout.addEventListener('click', () => {
      localStorage.removeItem('accessToken');
      window.location.reload();
    });
    loadUser();
  </script>
</body>
</html>
