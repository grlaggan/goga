<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goga — расписание</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font: 16px system-ui, sans-serif; color: #1d2433; background: #f4f5f7; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 18px max(24px, calc((100% - 960px) / 2)); background: #fff; border-bottom: 1px solid #e2e5ea; }
    .brand { color: #1d2433; font-size: 20px; font-weight: 700; text-decoration: none; }
    nav { display: flex; align-items: center; gap: 16px; }
    a { color: #315bea; font-weight: 600; text-decoration: none; }
    button { padding: 9px 14px; border: 0; border-radius: 8px; background: #315bea; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.secondary { background: #eef1f8; color: #315bea; }
    main { width: min(100% - 32px, 760px); margin: 48px auto; padding: 40px; background: #fff; border: 1px solid #e2e5ea; border-radius: 14px; box-shadow: 0 12px 35px #17203312; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { margin: 0 0 28px; color: #657084; }
    .day-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .day-tab { padding: 8px 16px; border: 1px solid #cbd1da; border-radius: 8px; background: #fff; color: #315bea; font: inherit; font-weight: 600; cursor: pointer; }
    .day-tab.active { background: #315bea; border-color: #315bea; color: #fff; }
    .lesson { display: flex; gap: 16px; padding: 16px; border: 1px solid #e2e5ea; border-radius: 10px; margin-bottom: 12px; }
    .lesson-time { min-width: 90px; font-weight: 700; color: #315bea; }
    .lesson-info { flex: 1; }
    .lesson-subject { font-weight: 700; margin-bottom: 4px; }
    .lesson-meta { font-size: 14px; color: #657084; line-height: 1.5; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-right: 6px; }
    .badge.lecture { background: #e8f0fe; color: #315bea; }
    .badge.practice { background: #fef3e8; color: #b3541e; }
    .badge.sync { background: #e6f4ea; color: #24733d; }
    .badge.async { background: #f3e8fd; color: #7c3aed; }
    .empty { padding: 32px; text-align: center; color: #657084; }
    .hidden { display: none; }
    @media (max-width: 520px) { header { padding: 16px; } main { margin: 24px auto; padding: 24px; } .lesson { flex-direction: column; gap: 8px; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Goga</a>
    <nav>
      <a href="/">Главная</a>
      <a href="/auth.html">Войти</a>
      <button id="logout" class="secondary hidden" type="button">Выйти</button>
    </nav>
  </header>
  <main>
    <h1>Расписание</h1>
    <p class="subtitle" id="subtitle">Загрузка...</p>
    <div class="day-tabs">
      <button class="day-tab active" id="tabToday" type="button">Сегодня</button>
      <button class="day-tab" id="tabTomorrow" type="button">Завтра</button>
    </div>
    <div id="schedule"></div>
  </main>
  <script>
    const token = localStorage.getItem('accessToken');
    const logout = document.querySelector('#logout');
    const subtitle = document.querySelector('#subtitle');
    const schedule = document.querySelector('#schedule');
    const tabToday = document.querySelector('#tabToday');
    const tabTomorrow = document.querySelector('#tabTomorrow');

    if (!token) {
      subtitle.textContent = 'Вы не авторизованы.';
      schedule.innerHTML = '<div class="empty">Войдите, чтобы увидеть расписание.</div>';
    } else {
      logout.classList.remove('hidden');
    }

    function formatTime(number) {
      const times = { 1: '08:30', 2: '10:15', 3: '12:00', 4: '14:00', 5: '15:45', 6: '17:30' };
      return times[number] || '—';
    }

    function renderLessons(lessons) {
      if (!lessons.length) {
        schedule.innerHTML = '<div class="empty">Пар нет.</div>';
        return;
      }
      schedule.innerHTML = lessons.map(l => `
        <div class="lesson">
          <div class="lesson-time">${formatTime(l.number)}</div>
          <div class="lesson-info">
            <div class="lesson-subject">${l.subject}</div>
            <div class="lesson-meta">
              <span class="badge ${l.type === 0 ? 'lecture' : 'practice'}">${l.type === 0 ? 'Лекция' : 'Практика'}</span>
              <span class="badge ${l.format === 0 ? 'sync' : 'async'}">${l.format === 0 ? 'Синхронно' : 'Асинхронно'}</span>
              ${l.building}, ${l.auditorium} — ${l.lecturer}
            </div>
          </div>
        </div>
      `).join('');
    }

    async function loadSchedule(endpoint, dayLabel) {
      schedule.innerHTML = '<div class="empty">Загрузка...</div>';
      try {
        const response = await fetch(`/api/timetable/${endpoint}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!response.ok) throw new Error();
        const data = await response.json();
        subtitle.textContent = `${dayLabel} — группа ${data.group}, ${data.weekParity === 0 ? 'чётная' : 'нечётная'} неделя`;
        renderLessons(data.lessons);
      } catch {
        subtitle.textContent = 'Ошибка загрузки.';
        schedule.innerHTML = '<div class="empty">Не удалось загрузить расписание.</div>';
      }
    }

    tabToday.addEventListener('click', () => {
      tabToday.classList.add('active');
      tabTomorrow.classList.remove('active');
      loadSchedule('today', 'Сегодня');
    });

    tabTomorrow.addEventListener('click', () => {
      tabTomorrow.classList.add('active');
      tabToday.classList.remove('active');
      loadSchedule('tomorrow', 'Завтра');
    });

    logout.addEventListener('click', () => {
      localStorage.removeItem('accessToken');
      window.location.reload();
    });

    if (token) loadSchedule('today', 'Сегодня');
  </script>
</body>
</html>
